[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mast-kan"
version = "1.0.0"
description = "MAST-KAN vessel trajectory forecasting"
requires-python = ">=3.10,<3.12"
license = "MIT"
license-files = ["LICENSE", "mast_kan/KAN_LICENSE"]
dependencies = [
  "torch==2.3.1",
  "numpy==2.2.6",
  "tqdm==4.67.3",
  "mamba-ssm==2.2.2",
  "causal-conv1d==1.4.0",
  "einops==0.8.2",
]

[project.optional-dependencies]
data = ["pandas==2.3.3"]

[tool.setuptools]
packages = ["mast_kan"]

[tool.setuptools.package-data]
mast_kan = ["KAN_LICENSE"]
